issueNumber: MDL-90234
notes:
  core:
    - message: >
        Moodle now supports fetching the currently logged in user from
        Dependency Injection using the `\core\current_user` object.


        This class can be used to access the current user object from its
        `get_user_object(): \stdClass` method.


        It also provides accessors for fetching the id.
      type: improved
