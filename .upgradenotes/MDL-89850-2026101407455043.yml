issueNumber: MDL-89850
notes:
  core:
    - message: >
        The `\core\router\response\exception_response::get_payload_data()`
        method has been deprecated and replaced with a new
        `get_response_payload()` method which has strictly typed properties.


        If you wish to add additional properties to the exception payload you
        should do so in the existing `get_response()` method.
