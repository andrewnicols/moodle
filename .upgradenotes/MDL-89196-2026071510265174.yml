issueNumber: MDL-89196
notes:
  theme:
    - message: |
        The `core/loginform` template from Moodle core has been removed, and
        replaced by the `core/login_form` template, taken from the Boost
        version of `core/login`.

        The previously used core version has not been used in core for some
        time, and was not tested or validated.

        Themes wishing to override the login form should now either:

        - Override the `core/login_form` template; or
        - Override the `\core\output\core_renderer::login_form()` method in their theme renderer class.
      type: changed
    - message: |
        The `core/login_form` template has been broken into smaller templates, which are used to render the login form. The intent is to allow theme designers to customise the login form and maintain it more easily. The new templates are:

        - `core/local/login_form/cookiesnotice` - renders the cookies notice
        - `core/local/login_form/errorinfo` - renders the error information
        - `core/local/login_form/guestlogin` - renders the guest login form
        - `core/local/login_form/identityproviders` - renders the identity providers
        - `core/local/login_form/authinstructions` - renders the authentication instructions
        - `core/local/login_form/signupinstructions` - renders the signup instructions
        - `core/local/login_form/languagemenu` - renders the language menu
        - `core/local/login_form/logo` - renders the login logo
        - `core/local/login_form/maintenance` - renders the maintenance message
      type: improved
